onboarding = false

[worktrees]
# Worktrees debaixo de ~/Trabalho para que o CLAUDE.md do workspace
# (~/Trabalho/CLAUDE.md) seja ancestral e carregue nas sessões do Claude Code.
# Layout: <directory>/<repo>/<branch>
directory = "~/Trabalho/worktrees"

[experimental]
pane_history = false
switch_ascii_input_source_in_prefix = false

[ui.toast]
delivery = "herdr"

[theme]
name = "kanagawa"
auto_switch = false

[ui]
agent_panel_sort = "spaces"

[keys]
prefix = "ctrl+space"
split_vertical = ["prefix+v", "prefix+%"]
split_horizontal = ["prefix+minus", 'prefix+"']
toggle_sidebar = ["prefix+b", "prefix+t"]
help = "prefix+f1"
# Navegação sem prefix: ctrl+hjkl entre painéis, alt+shift+h/l entre abas
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
previous_tab = ["prefix+p", "alt+shift+h"]
next_tab = ["prefix+n", "alt+shift+l"]

# Plugins (instalados fixos nos commits auditados em 2026-11-06)
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-whichkey.open"
description = "whichkey menu"

[[keys.command]]
key = "prefix+?"
type = "plugin_action"
command = "ramarivera.pretty-which.open"
description = "pretty which (guia de atalhos)"
