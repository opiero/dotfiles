# Bloqueada e 3 min sem mexer -> screensaver dentro da tela de bloqueio.
# 10 min sem mexer -> bloqueia e já liga o screensaver.
# Qualquer tecla/mouse desliga o screensaver e volta a tela de bloqueio normal.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 180
    on-timeout = pidof hyprlock && ~/.config/hypr/screensaver/lock-screensaver.sh start
    on-resume = ~/.config/hypr/screensaver/lock-screensaver.sh stop
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session; sleep 1; ~/.config/hypr/screensaver/lock-screensaver.sh start
    on-resume = ~/.config/hypr/screensaver/lock-screensaver.sh stop
}
