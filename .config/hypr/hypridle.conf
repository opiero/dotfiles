# Idle estilo Omarchy: screensaver aos 2,5 min, bloqueio aos 5 min.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 150
    on-timeout = ~/.config/hypr/screensaver/launch.sh
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
